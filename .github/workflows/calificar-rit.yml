name: Calificar socialización RIT

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  calificar:
    if: startsWith(github.event.issue.title, '[RIT 2026]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const quiz = JSON.parse(fs.readFileSync('.github/scripts/quiz.json', 'utf8'));
            const body = context.payload.issue.body || '';

            // Issue form bodies look like "### <label>\n\n<value>\n\n### ..."
            const answers = {};
            for (const part of body.split(/^### /m).slice(1)) {
              const nl = part.indexOf('\n');
              answers[part.slice(0, nl).trim()] = part.slice(nl).trim();
            }

            let correct = 0;
            const rows = quiz.map(q => {
              const given = answers[q.pregunta] || '_Sin respuesta_';
              const ok = given === q.correcta;
              if (ok) correct++;
              return `| ${ok ? '✅' : '❌'} | ${q.pregunta} | ${ok ? given : `${given}<br>**Correcta:** ${q.correcta} (${q.ref})`} |`;
            });
            const pct = Math.round((correct / quiz.length) * 100);
            const passed = pct >= 70;

            const marker = '<!-- calificacion-rit -->';
            const comment = [
              marker,
              `## Resultado: ${correct}/${quiz.length} (${pct}%) — ${passed ? 'Aprobado ✅' : 'Requiere repaso 📘'}`,
              '',
              '| | Pregunta | Respuesta |',
              '|---|---|---|',
              ...rows,
              '',
              passed
                ? 'Gracias por completar la socialización del RIT 2026.'
                : 'Te recomendamos repasar los artículos indicados y volver a responder editando este issue.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const existing = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
            }

            const labels = ['socializacion-rit', passed ? 'aprobado' : 'requiere-repaso'];
            for (const old of ['aprobado', 'requiere-repaso'].filter(l => !labels.includes(l))) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: old }).catch(() => {});
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
